name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ao-architecture
        uses: actions/checkout@v7

      - name: Verify architecture docs
        run: python3 scripts/verify_architecture.py

      - name: Verify external-beta preflight manifest and links
        run: python3 scripts/verify_external_beta_preflight.py --repository-only

      - name: Verify external-beta preflight unit tests
        run: python3 -m unittest scripts/test_verify_external_beta_preflight.py

      - name: Verify authority inventory
        run: python3 scripts/verify_topology.py

      - name: Verify topology unit tests
        run: python3 -m unittest scripts/test_verify_topology.py

      - name: Verify readiness wording
        run: python3 scripts/verify_readiness_wording.py

      - name: Verify readiness wording unit tests
        run: python3 -m unittest scripts/test_verify_readiness_wording.py

      - name: Verify contract inventory
        run: python3 scripts/verify_contract_inventory.py

      - name: Verify contract inventory unit tests
        run: python3 -m unittest scripts/test_verify_contract_inventory.py

      - name: Verify contract owner registry
        run: python3 scripts/verify_contract_owner_registry.py

      - name: Verify contract owner registry unit tests
        run: python3 -m unittest scripts/test_verify_contract_owner_registry.py

      - name: Verify compatibility matrix
        run: python3 scripts/verify_compatibility_matrix.py

      - name: Verify compatibility matrix unit tests
        run: python3 -m unittest scripts/test_verify_compatibility_matrix.py

      - name: Verify contract evolution policy
        run: python3 scripts/verify_contract_evolution_policy.py

      - name: Verify contract evolution policy unit tests
        run: python3 -m unittest scripts/test_verify_contract_evolution_policy.py

      - name: Verify execution-observation version skew
        run: python3 scripts/verify_execution_observation_version_skew.py

      - name: Verify execution-observation version skew unit tests
        run: python3 -m unittest scripts/test_verify_execution_observation_version_skew.py

      - name: Verify evidence freshness and maintenance
        run: |
          python3 scripts/verify_evidence_freshness.py
          python3 scripts/verify_evidence_maintenance.py

      - name: Verify evidence freshness and maintenance unit tests
        run: python3 -m unittest scripts/test_verify_evidence_freshness.py scripts/test_verify_evidence_maintenance.py

      - name: Verify contract compatibility window
        run: python3 scripts/verify_contract_compatibility_window.py

      - name: Verify contract compatibility window unit tests
        run: python3 -m unittest scripts/test_verify_contract_compatibility_window.py

      - name: Verify contract migration and rollback results
        run: python3 scripts/verify_contract_migration_and_rollback_results.py

      - name: Verify contract migration and rollback results unit tests
        run: python3 -m unittest scripts/test_verify_contract_migration_and_rollback_results.py

      - name: Checkout AO Mission compatibility history
        uses: actions/checkout@v7
        with:
          repository: uesugitorachiyo/ao-mission
          ref: 7e7de94af5f2f463fb18a7d2fdf829e66787167f
          path: tmp/ao-mission
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout AO Command compatibility history
        uses: actions/checkout@v7
        with:
          repository: uesugitorachiyo/ao-command
          ref: 7cda85e56c2aa0dbf2e3772a11a6d2c93ba86303
          path: tmp/ao-command
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact AO2 discovery producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao2
          ref: 53e45313e8031071d730601a64be22b4d9b0c7fe
          path: tmp/ao2-production
          persist-credentials: false

      - name: Checkout exact AO Command discovery consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uesugitorachiyo/ao-command
          ref: c1c729db79e6be6037184ea9322f59d1cf511748
          path: tmp/ao-command-production
          persist-credentials: false

      - name: Install exact Rust toolchain for production replay
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Install exact Go toolchain for production replay
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          check-latest: false
          cache: false

      - name: Prefetch lockfile-verified replay dependencies
        run: |
          cargo fetch --locked --manifest-path tmp/ao2-production/Cargo.toml
          cd tmp/ao-command-production
          GOTOOLCHAIN=local go mod download

      - name: Execute immutable cross-version fixtures
        run: |
          python3 scripts/run_contract_cross_version_fixtures.py \
            --mission-repository tmp/ao-mission \
            --command-repository tmp/ao-command

      - name: Verify GitHub issue workflow contracts
        run: python3 scripts/verify_github_issue_workflow_contracts.py

      - name: Verify GitHub issue workflow contract unit tests
        run: python3 -m unittest scripts/test_verify_github_issue_workflow_contracts.py

      - name: Verify autonomous GitHub issue repair contract unit tests
        run: python3 -m unittest scripts/test_github_issue_autonomous_contracts.py

      - name: Verify production discovery compatibility
        run: |
          python3 scripts/verify_github_issue_production_compatibility.py \
            --ao2-repository tmp/ao2-production \
            --command-repository tmp/ao-command-production \
            --replay

      - name: Verify production discovery compatibility unit tests
        run: python3 -m unittest scripts/test_verify_github_issue_production_compatibility.py

      - name: Verify stack lockfile
        run: python3 scripts/verify_stack_lock.py

      - name: Verify stack lockfile unit tests
        run: python3 -m unittest scripts/test_verify_stack_lock.py

      - name: Verify current release manifest
        run: python3 scripts/verify_current_release_manifest.py

      - name: Verify current release manifest unit tests
        run: python3 -m unittest scripts/test_verify_current_release_manifest.py

      - name: Verify Windows V3 manifest fixture
        run: python3 scripts/verify_windows_v3_manifest.py

      - name: Verify Windows V3 manifest fixture unit tests
        run: python3 -m unittest scripts/test_verify_windows_v3_manifest.py

      - name: Verify DSA measurement contract
        run: python3 scripts/verify_dsa_measurement_contract.py

      - name: Verify DSA measurement contract unit tests
        run: python3 -m unittest scripts/test_verify_dsa_measurement_contract.py

      - name: Verify beta install preflight matrix
        run: python3 scripts/verify_beta_install_preflight_matrix.py

      - name: Verify beta install preflight matrix unit tests
        run: python3 -m unittest scripts/test_verify_beta_install_preflight_matrix.py

      - name: Verify beta operations SLO draft
        run: python3 scripts/verify_beta_operations_slo_draft.py

      - name: Verify beta operations SLO draft unit tests
        run: python3 -m unittest scripts/test_verify_beta_operations_slo_draft.py

      - name: Public safety scan
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = (
              rb"ghp_",
              rb"github_pat_",
              rb"BEGIN RSA",
              rb"BEGIN OPENSSH",
              rb"ANTIGRAVITY",
              rb"private handoff",
              rb"api_key",
              rb"access_token",
          )
          allowed_declarations = {
              (
                  pathlib.Path("scripts/verify_architecture.py"),
                  b'    r"OPENAI_API_KEY",',
                  rb"api_key",
              ),
              (
                  pathlib.Path("scripts/verify_architecture.py"),
                  b'    r"ANTHROPIC_API_KEY",',
                  rb"api_key",
              ),
          }
          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", "README.md", "overview", "scripts", "stack"],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")

          findings = []
          for encoded_path in filter(None, tracked):
              path = pathlib.Path(encoded_path.decode("utf-8", errors="surrogateescape"))
              content = path.read_bytes()
              for line_number, line in enumerate(content.splitlines(), start=1):
                  for pattern in patterns:
                      if not re.search(pattern, line, flags=re.IGNORECASE):
                          continue
                      if (path, line, pattern) in allowed_declarations:
                          continue
                      findings.append(
                          f"{path}:{line_number}: forbidden pattern {pattern.decode('ascii')!r}"
                      )

          if findings:
              print("\n".join(findings), file=sys.stderr)
              raise SystemExit(1)
          print(f"public safety scan passed for {len(tracked) - 1} tracked files")
          PY

  windows-default-environment:
    name: windows-default-environment
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONUTF8: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure Git newline policy before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source with spaces

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify default Windows environment
        working-directory: source with spaces
        run: |
          $ErrorActionPreference = "Stop"
          $eol = git ls-files --eol
          if ($eol -match "w/crlf") { throw "tracked files must remain LF under the default Windows checkout" }
          if ((git config --get core.autocrlf) -ne "true") { throw "core.autocrlf must be true" }
          if ($env:PYTHONUTF8 -ne "0") { throw "PYTHONUTF8 must be 0" }
          if ([IO.File]::ReadAllText("CLAUDE.md", [Text.Encoding]::UTF8) -ne "@AGENTS.md`n") { throw "CLAUDE.md bytes are not canonical" }
          python factory/windows-remediation/reusable-windows-preflight/windows_preflight.py --profile binary --json --root (Get-Location)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows contract tests
        working-directory: source with spaces
        run: |
          python -m unittest scripts.test_verify_windows_default_workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts.test_verify_architecture_utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s factory/windows-remediation/reusable-windows-preflight -p test_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows checkout diff
        working-directory: source with spaces
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
