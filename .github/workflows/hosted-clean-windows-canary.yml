name: Hosted Clean Windows Canary

on:
  push:
    branches:
      - codex/gate4-clean-host
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-windows-canary:
    name: clean-windows-canary
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Configure deterministic checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf true
          $env:PYTHONUTF8 = '0'
          "PYTHONUTF8=$env:PYTHONUTF8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout into a path containing spaces
        uses: actions/checkout@v7
        with:
          path: AO Stack Clean Host

      - name: Verify clean host and run public stack canary
        shell: pwsh
        working-directory: AO Stack Clean Host
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git status --porcelain).Length -ne 0) { throw 'checkout is not clean' }
          if ((Get-Location).Path -notmatch ' ') { throw 'workspace path must contain spaces' }
          if ($env:PYTHONUTF8 -ne '0') { throw 'PYTHONUTF8 must be 0' }
          python scripts/run_public_stack_canary.py --target windows-x86_64 --output hosted-clean-windows-canary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload hosted evidence
        uses: actions/upload-artifact@v7
        with:
          name: hosted-clean-windows-canary
          path: AO Stack Clean Host/hosted-clean-windows-canary.json
          if-no-files-found: error
          retention-days: 14
